<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kubernetes Cluster in 3D</title>
<meta name="description" content="A Kubernetes cluster drawn as a container yard you can rotate, zoom and take apart: click any part to see what it does.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;700&display=swap">
<script>try{var t=localStorage.getItem("coursehub:theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
/* Layout: a full-width viewport with a tool rail on top and an inspector beside it (below it on phones). */
:root {
  --bg: #f1f1ee; --panel: #fbfbfa; --ink: #1a1b1e; --muted: #64666d; --line: #dcdcd8; --accent: #3557c9; --good: #2a8655; --bad: #c8363c;
  --scene-bg: #f6f6f3;
  --display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0d0d0e; --panel: #151516; --ink: #e8e8eb; --muted: #8d8f96; --line: #2b2b2e; --accent: #8aa4ff; --good: #5cc28c; --bad: #ff6b6b; --scene-bg: #121213; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0d0d0e; --panel: #151516; --ink: #e8e8eb; --muted: #8d8f96; --line: #2b2b2e; --accent: #8aa4ff; --good: #5cc28c; --bad: #ff6b6b; --scene-bg: #121213; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--display); }
body { padding-inline: 16px; padding-block: env(safe-area-inset-top, 0px) 32px; }
.wrap { max-width: 1240px; margin: 0 auto; }
a { color: inherit; }
.top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding-block: 16px; font: 500 12px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.top a { text-decoration: none; color: var(--ink); }
h1 { margin: 4px 0 6px; font-size: clamp(26px, 4vw, 40px); line-height: 1.05; letter-spacing: -.02em; text-wrap: balance; }
.lede { margin: 0 0 16px; color: var(--muted); max-width: 70ch; }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
@media (max-width: 900px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.viewer { position: relative; height: min(72vh, 680px); min-height: 380px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--scene-bg); }
.viewer canvas { display: block; touch-action: none; outline: none; }
.viewer canvas:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.rail { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; z-index: 3; }
.rail button { pointer-events: auto; font: 500 12px/1 var(--mono); color: var(--ink); background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 999px; padding: 8px 11px; cursor: pointer; backdrop-filter: blur(6px); }
.rail button:hover { border-color: var(--ink); }
.rail button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.rail .spacer { flex: 1; }
.hud { position: absolute; left: 10px; bottom: 10px; right: 10px; display: flex; justify-content: space-between; gap: 10px; font: 500 12px/1.3 var(--mono); color: var(--muted); pointer-events: none; z-index: 3; }
.hud b { color: var(--ink); font-weight: 500; }
.hint { opacity: .9; }
/* labels that stay upright and readable at any angle and zoom */
.lbl { font: 500 12.5px/1.2 var(--mono); color: var(--ink); background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--line); padding: 3px 7px; border-radius: 6px; white-space: nowrap; pointer-events: auto; cursor: pointer; transform: translateY(-10px); user-select: none; }
.lbl:hover, .lbl.is-sel { border-color: var(--accent); color: var(--accent); }
.lbl.is-small { font-size: 11px; padding: 2px 5px; }
.lbl.is-bad { color: var(--bad); border-color: var(--bad); }
.labels-off .lbl:not(.is-sel), .labels-crowded .lbl:not(.is-sel) { display: none; }
@media (max-width: 600px) { .viewer { height: min(64vh, 520px); } .rail button { padding: 7px 9px; font-size: 11.5px; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; }
.panel h2 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
.kind { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.panel p { margin: 0; color: var(--ink); }
.panel .muted { color: var(--muted); font-size: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions button, .parts button { font: 500 12.5px/1 var(--mono); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 9px 12px; cursor: pointer; }
.actions button:hover, .parts button:hover { border-color: var(--ink); }
.actions .danger { color: var(--bad); border-color: currentColor; }
pre { margin: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: 400 12px/1.55 var(--mono); white-space: pre; overflow-x: auto; background: var(--bg); }
.parts { display: flex; flex-wrap: wrap; gap: 6px; }
.parts button { padding: 6px 9px; font-size: 11.5px; }
.parts button[aria-current="true"] { border-color: var(--accent); color: var(--accent); }
.stats { font: 400 12px/1.6 var(--mono); color: var(--muted); }
.fallback { padding: 24px; color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.viewer:fullscreen { height: 100vh; border-radius: 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="../../">← Course Hub</a><span>Prototype · 3D figure</span><a href="../../kubernetes/cluster-yard/">2D version</a></div>
  <h1>The cluster, in 3D</h1>
  <p class="lede">Drag to rotate, scroll or pinch to zoom, right-drag (or two fingers) to pan. Click any part to see what it is and what you can do with it.</p>
  <div class="stage">
    <div class="viewer" id="viewer">
      <div class="rail" role="toolbar" aria-label="View">
        <button type="button" data-view="iso">Iso</button>
        <button type="button" data-view="top">Top</button>
        <button type="button" data-view="front">Front</button>
        <button type="button" data-view="side">Side</button>
        <button type="button" id="spin" aria-pressed="false">Auto-rotate</button>
        <span class="spacer"></span>
        <button type="button" id="labels" aria-pressed="true">Labels</button>
        <button type="button" id="theme">Theme</button>
        <button type="button" id="full">Full screen</button>
      </div>
      <div class="hud"><span class="hint" id="hint">Click a part</span><span id="readout"></span></div>
    </div>
    <aside class="panel" aria-live="polite" id="panel"></aside>
  </div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="app.js"></script>
</body>
</html>
